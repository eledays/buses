<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Автобусы{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='icons/favicon.ico') }}" type="image/x-icon">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">
        <span class="brand-mark"></span>
        <span>Автобусы</span>
      </a>
      <nav class="nav">
        <a class="{{ 'active' if active_page == 'entry' else '' }}" href="{{ url_for('main.index') }}">Запись</a>
        <a class="{{ 'active' if active_page == 'profile' else '' }}" href="{{ url_for('main.stats') }}">Статистика</a>
        <a class="{{ 'active' if active_page == 'rides' else '' }}" href="{{ url_for('main.rides') }}">Поездки</a>
      </nav>
      <div class="account-bar">
        {% if current_user %}
          <span>{{ current_user.display_name or current_user.login or current_user.email or "Аккаунт" }}</span>
          <a href="{{ url_for('auth.logout') }}">Выйти</a>
        {% else %}
          <span>Гостевой режим</span>
          <a href="{{ url_for('auth.login') }}">Войти через Яндекс</a>
        {% endif %}
      </div>
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
