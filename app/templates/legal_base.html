<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Автобусы{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='icons/favicon.ico') }}" type="image/x-icon">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  </head>
  <body>
    <header class="topbar legal-topbar">
      <a class="brand" href="{{ url_for('main.index') }}" aria-label="На главную">
        <span class="brand-mark"></span>
        <span>Автобусы</span>
      </a>
    </header>

    <main class="legal-main">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
